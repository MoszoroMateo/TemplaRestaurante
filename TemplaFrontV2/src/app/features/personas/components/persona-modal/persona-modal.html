<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-dark/50 backdrop-blur-sm" (click)="onCancel()">

  <!-- Panel -->
  <div class="relative w-full max-w-xl bg-surface mx-4" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between px-10 pt-10 pb-4 border-b border-muted/10">
      <div>
        <h2 class="font-heading text-2xl font-medium text-deep italic tracking-tight">
          {{ isEditMode() ? 'Edit Person' : 'New Person' }}
        </h2>
        <p class="font-body text-sm text-muted mt-1">
          {{ isEditMode() ? 'Update the person\'s information below.' : 'Fill in the details to create a new person.' }}
        </p>
      </div>
      <button type="button" class="flex items-center justify-center w-10 h-10 text-muted hover:text-deep hover:bg-bg transition-colors cursor-pointer border-none bg-transparent rounded-none" (click)="onCancel()">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="px-10 py-6 space-y-8">

        <!-- ===== SECTION: Personal Information ===== -->
        <div>
          <div class="flex items-center gap-2 mb-5">
            <svg class="w-4 h-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            <h3 class="font-nav text-[11px] font-semibold tracking-[0.15em] uppercase text-deep">Personal Information</h3>
            <span class="flex-1 border-t border-muted/10"></span>
          </div>

          <div class="grid grid-cols-2 gap-x-6 gap-y-5">

            <!-- Name -->
            <div class="relative w-full border-b border-muted/30 focus-within:border-primary transition-colors duration-150">
              <input id="nombre" formControlName="nombre" type="text" placeholder=" "
                class="peer w-full bg-transparent pt-6 pb-2 font-body text-sm text-deep outline-none placeholder-transparent rounded-none" />
              <label for="nombre"
                class="absolute left-0 top-6 origin-[0] -translate-y-4 scale-75 transform font-body text-xs text-muted duration-150
                       peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100
                       peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-primary peer-focus:font-semibold peer-focus:tracking-[0.1em] peer-focus:uppercase">
                Name
              </label>
            </div>

            <!-- Last Name -->
            <div class="relative w-full border-b border-muted/30 focus-within:border-primary transition-colors duration-150">
              <input id="apellido" formControlName="apellido" type="text" placeholder=" "
                class="peer w-full bg-transparent pt-6 pb-2 font-body text-sm text-deep outline-none placeholder-transparent rounded-none" />
              <label for="apellido"
                class="absolute left-0 top-6 origin-[0] -translate-y-4 scale-75 transform font-body text-xs text-muted duration-150
                       peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100
                       peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-primary peer-focus:font-semibold peer-focus:tracking-[0.1em] peer-focus:uppercase">
                Last Name
              </label>
            </div>

            <!-- DNI -->
            <div class="relative w-full border-b border-muted/30 focus-within:border-primary transition-colors duration-150">
              <input id="dni" formControlName="dni" type="text" inputmode="numeric" placeholder=" "
                class="peer w-full bg-transparent pt-6 pb-2 font-body text-sm text-deep outline-none placeholder-transparent rounded-none" />
              <label for="dni"
                class="absolute left-0 top-6 origin-[0] -translate-y-4 scale-75 transform font-body text-xs text-muted duration-150
                       peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100
                       peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-primary peer-focus:font-semibold peer-focus:tracking-[0.1em] peer-focus:uppercase">
                Document
              </label>
            </div>

            <!-- Type (button group instead of select) -->
            <div class="flex flex-col justify-end pb-2">
              <span class="font-body text-xs text-muted mb-2 block">Type</span>
              <div class="flex border border-muted/20 divide-x divide-muted/20 rounded-none w-fit">
                @for (tipo of tipoPersonaOptions; track tipo) {
                  <label class="cursor-pointer px-5 py-2.5 font-nav text-[11px] font-semibold tracking-[0.1em] uppercase transition-all duration-150 select-none"
                    [class.bg-primary]="form.get('tipoPersona')?.value === tipo"
                    [class.text-white]="form.get('tipoPersona')?.value === tipo"
                    [class.text-muted]="form.get('tipoPersona')?.value !== tipo"
                    [class.hover:text-deep]="form.get('tipoPersona')?.value !== tipo">
                    <input type="radio" name="tipoPersona" [value]="tipo" class="hidden"
                      [checked]="form.get('tipoPersona')?.value === tipo"
                      (change)="form.patchValue({ tipoPersona: tipo })" />
                    {{ tipo === 'PERSONAL' ? 'Staff' : 'Client' }}
                  </label>
                }
              </div>
            </div>

          </div>
        </div>

        <!-- ===== SECTION: Contact Details ===== -->
        <div>
          <div class="flex items-center gap-2 mb-5">
            <svg class="w-4 h-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
            </svg>
            <h3 class="font-nav text-[11px] font-semibold tracking-[0.15em] uppercase text-deep">Contact Details</h3>
            <span class="flex-1 border-t border-muted/10"></span>
          </div>

          <div class="grid grid-cols-2 gap-x-6 gap-y-5">

            <!-- Email -->
            <div class="relative w-full border-b border-muted/30 focus-within:border-primary transition-colors duration-150">
              <input id="email" formControlName="email" type="email" placeholder=" "
                class="peer w-full bg-transparent pt-6 pb-2 font-body text-sm text-deep outline-none placeholder-transparent rounded-none" />
              <label for="email"
                class="absolute left-0 top-6 origin-[0] -translate-y-4 scale-75 transform font-body text-xs text-muted duration-150
                       peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100
                       peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-primary peer-focus:font-semibold peer-focus:tracking-[0.1em] peer-focus:uppercase">
                Email
              </label>
            </div>

            <!-- Phone -->
            <div class="relative w-full border-b border-muted/30 focus-within:border-primary transition-colors duration-150">
              <input id="telefono" formControlName="telefono" type="tel" placeholder=" "
                class="peer w-full bg-transparent pt-6 pb-2 font-body text-sm text-deep outline-none placeholder-transparent rounded-none" />
              <label for="telefono"
                class="absolute left-0 top-6 origin-[0] -translate-y-4 scale-75 transform font-body text-xs text-muted duration-150
                       peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100
                       peer-focus:-translate-y-4 peer-focus:scale-75 peer-focus:text-primary peer-focus:font-semibold peer-focus:tracking-[0.1em] peer-focus:uppercase">
                Phone
              </label>
            </div>

          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-10 py-5 border-t border-muted/10 bg-bg/20">
        <button type="button"
          class="h-12 px-8 bg-transparent border border-deep text-deep hover:bg-deep hover:text-white font-nav text-xs font-semibold tracking-[0.15em] uppercase transition-all duration-150 rounded-none cursor-pointer"
          (click)="onCancel()">
          Cancel
        </button>
        <button type="submit"
          class="h-12 px-8 bg-primary hover:bg-primary-hover text-white font-nav text-xs font-semibold tracking-[0.15em] uppercase transition-colors duration-150 rounded-none cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="form.invalid">
          {{ isEditMode() ? 'Save' : 'Create' }}
        </button>
      </div>

    </form>

  </div>
</div>
