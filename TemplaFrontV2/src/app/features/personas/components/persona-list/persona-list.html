<div class="p-4 md:p-6 lg:p-8 font-body space-y-5 md:space-y-6">

  <!-- ══════════ PAGE HEADER ══════════ -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h1 class="font-heading text-2xl md:text-3xl font-medium text-deep italic tracking-tight leading-tight">
        Staff &amp; Clients
      </h1>
      <p class="font-body text-sm text-muted mt-1">
        Manage your team and clientele with precision.
      </p>
    </div>

    <!-- New Person Button — Vertical Fill Hover -->
    <button
      (click)="openNewPersonModal()"
      class="group relative flex items-center gap-2 h-12 px-7 bg-primary text-white font-nav text-[11px] font-semibold tracking-[0.15em] uppercase rounded-none cursor-pointer overflow-hidden shrink-0 transition-colors duration-300"
      style="--fill-color: var(--color-primary-hover, #A86742);"
    >
      <!-- Fill effect -->
      <span
        class="absolute inset-0 bg-[var(--fill-color)] scale-y-0 origin-bottom transition-transform duration-300 ease-out group-hover:scale-y-100"
        aria-hidden="true"
      ></span>

      <svg class="w-4 h-4 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span class="relative z-10">New Person</span>
    </button>
  </div>

  <!-- ══════════ STATS CARDS ══════════ -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
    <div class="bg-white/40 backdrop-blur-md border border-white/20 border-l-2 border-l-deep/20 shadow-sm px-5 py-4">
      <p class="font-nav text-[10px] font-semibold tracking-[0.15em] uppercase text-muted">Total</p>
      <p class="font-heading text-2xl font-medium text-deep mt-1">{{ stats().total }}</p>
    </div>
    <div class="bg-accent/10 backdrop-blur-md border border-white/20 border-l-2 border-l-accent shadow-sm px-5 py-4">
      <p class="font-nav text-[10px] font-semibold tracking-[0.15em] uppercase text-muted">Staff Active</p>
      <p class="font-heading text-2xl font-medium text-accent mt-1">{{ stats().staffActive }}</p>
    </div>
    <div class="bg-info/10 backdrop-blur-md border border-white/20 border-l-2 border-l-info shadow-sm px-5 py-4">
      <p class="font-nav text-[10px] font-semibold tracking-[0.15em] uppercase text-muted">Clients Active</p>
      <p class="font-heading text-2xl font-medium text-info mt-1">{{ stats().clientsActive }}</p>
    </div>
    <div class="bg-error/10 backdrop-blur-md border border-white/20 border-l-2 border-l-error shadow-sm px-5 py-4">
      <p class="font-nav text-[10px] font-semibold tracking-[0.15em] uppercase text-muted">Inactive</p>
      <p class="font-heading text-2xl font-medium text-error mt-1">{{ stats().inactive }}</p>
    </div>
  </div>

  <!-- ══════════ FILTERS CARD ══════════ -->
  <div class="relative bg-surface/60 backdrop-blur-md border border-white/20 border-t-2 border-t-primary/30 shadow-sm">
    <div class="flex flex-col gap-5 md:flex-row md:items-center md:justify-between px-7 py-5">

      <!-- Search — Animated Focus Indicator -->
      <div class="relative w-full md:w-80">
        <label for="search" class="sr-only">Search people</label>
        <input
          type="text"
          id="search"
          placeholder="Search person..."
          class="peer w-full h-12 bg-white/60 backdrop-blur-sm border border-white/30 pl-11 pr-4 font-body text-sm text-deep outline-none placeholder:text-muted/60 transition-all duration-300 rounded-none"
          [(ngModel)]="busqueda"
          (input)="onBusquedaChange()"
        />
        <!-- Search icon -->
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-muted/50 pointer-events-none transition-opacity duration-200 peer-focus:opacity-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        <!-- Animated focus bar -->
        <span class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-primary transition-all duration-300 ease-out peer-focus:w-full peer-focus:left-0" aria-hidden="true"></span>
      </div>

      <!-- Filter groups -->
      <div class="flex flex-wrap items-center gap-4">
        <span class="font-nav text-[10px] font-semibold tracking-[0.15em] uppercase text-muted/70">Filter by:</span>

        <app-filter-group
          [options]="tipoFilterOptions"
          name="tipoFilter"
          [(selected)]="tipoSeleccionado"
          (selectionChange)="onFilterChange()"
          class="bg-white/50 backdrop-blur-sm border border-white/30"
        />

        <app-filter-group
          [options]="estadoFilterOptions"
          name="estadoFilter"
          [(selected)]="estadoSeleccionado"
          (selectionChange)="onFilterChange()"
          class="bg-white/50 backdrop-blur-sm border border-white/30"
        />
      </div>

    </div>
  </div>

  <!-- ══════════ TABLE CARD — Zen Mode Transparency ══════════ -->
  <div class="bg-white/40 backdrop-blur-md border border-white/20 shadow-sm overflow-hidden">
    <app-data-table
      [columns]="columns"
      [data]="personas()"
      [loading]="isLoading()"
      [skeleton]="isLoading()"
      [minLoadingMs]="850"
      [badgeMaps]="badgeMaps"
      [customValues]="customValues"
      [cellPrefixes]="cellPrefixes"
      [cellRenderers]="cellRenderers"
      [totalItems]="pageInfo()?.totalElements ?? 0"
      [pageSize]="pageInfo()?.size ?? 10"
      [currentPage]="pageInfo()?.number ?? 0"
      [trackBy]="'id'"
      emptyMessage='No people found. Click <span class=\"font-semibold text-primary\">New Person</span> to add your first team member.'
      (pageChange)="irAPagina($event)"
    >
      <ng-template let-persona>
        <div class="flex items-center justify-center gap-1.5">
          <!-- Edit — Discreet, reveals on hover -->
          <button
            class="action-btn flex items-center justify-center w-9 h-9 text-muted/60 hover:text-primary hover:bg-primary/5 transition-all duration-200 rounded-none cursor-pointer border-none bg-transparent"
            (click)="openNewPersonModal(persona)"
            title="Edit"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
            </svg>
          </button>

          <!-- Delete — Discreet, reveals on hover -->
          <button
            class="action-btn flex items-center justify-center w-9 h-9 text-muted/60 hover:text-error hover:bg-error/5 transition-all duration-200 rounded-none cursor-pointer border-none bg-transparent"
            (click)="confirmDelete(persona)"
            title="Delete"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </div>
      </ng-template>
    </app-data-table>
  </div>

</div>

<!-- ══════════ MODAL ══════════ -->
@if (modalOpen()) {
  <app-persona-modal
    [isEditMode]="!!editPersona()"
    [personaData]="editPersona()"
    (save)="onModalSave($event)"
    (cancel)="closeModal()"
  />
}
